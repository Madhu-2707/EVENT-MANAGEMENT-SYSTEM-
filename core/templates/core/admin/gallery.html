{% extends 'core/admin/admin_base.html' %}

{% block admin_content %}
<div class="glass-card" style="padding: 30px; margin-bottom: 30px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2 style="margin: 0;">Gallery <span style="color: var(--accent-color);">Studio</span></h2>
        <div style="display: flex; gap: 15px;">
            <select id="galleryFilter" onchange="filterGallery(this.value)" style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 5px 15px; border-radius: 50px; color: white; outline: none;">
                <option value="all" style="color: black;">All Categories</option>
                {% for cat_code, cat_name in category_choices %}
                <option value="{{ cat_code }}" style="color: black;">{{ cat_name }}</option>
                {% endfor %}
            </select>
            <button class="btn-primary" style="padding: 10px 25px;" onclick="document.getElementById('addGalleryModal').style.display='flex'">
                <i class="fas fa-upload"></i> Upload Image
            </button>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;" id="galleryGrid">
        {% for image in images %}
        <div class="glass-card gallery-item" data-category="{{ image.category }}" style="padding: 0; overflow: hidden; position: relative; border-radius: 12px; height: 200px;">
            <img src="{{ image.image.url }}" alt="{{ image.category }}" style="width: 100%; height: 100%; object-fit: cover;">
            <div style="position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding: 20px 15px 10px; display: flex; justify-content: space-between; align-items: flex-end;">
                <span style="font-size: 0.8rem; font-weight: 600;">{{ image.get_category_display }}</span>
                <a href="{% url 'delete_gallery' image.id %}" style="color: #e74c3c; background: rgba(231, 76, 60, 0.2); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none;" onclick="return confirm('Delete this image?')">
                    <i class="fas fa-trash" style="font-size: 0.8rem;"></i>
                </a>
            </div>
        </div>
        {% empty %}
        <p style="text-align: center; color: var(--text-muted); grid-column: 1/-1; padding: 40px;">No images in the gallery yet.</p>
        {% endfor %}
    </div>
</div>

<!-- Upload Modal -->
<div id="addGalleryModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center; backdrop-filter: blur(5px);">
    <div class="glass-card" style="width: 400px; padding: 40px; position:relative;">
        <span onclick="this.parentElement.parentElement.style.display='none'" style="position:absolute; right:20px; top:20px; font-size:1.5rem; cursor:pointer;">&times;</span>
        <h3 style="margin-bottom:25px;">Upload <span style="color:var(--accent-color);">New Image</span></h3>
        <form action="{% url 'add_gallery' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:8px;">Event Category</label>
                <select name="category" required style="width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); padding:12px; color:white; border-radius:10px;">
                    {% for cat_code, cat_name in category_choices %}
                    <option value="{{ cat_code }}" style="color: black;">{{ cat_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div style="margin-bottom:25px;">
                <label style="display:block; margin-bottom:8px;">Select Image</label>
                <input type="file" name="image" required style="width:100%; background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; border:1px solid var(--glass-border); color:white;">
            </div>
            <button type="submit" class="btn-primary" style="width:100%; padding: 15px;">Start Upload</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function filterGallery(category) {
        const items = document.querySelectorAll('.gallery-item');
        items.forEach(item => {
            if (category === 'all' || item.getAttribute('data-category') === category) {
                item.style.display = 'block';
            } else {
                item.style.display = 'none';
            }
        });
    }
</script>
{% endblock %}
